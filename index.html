<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ángel Llanos - Elegir versión</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&display=swap" rel="stylesheet">
<style>
    :root{
        --bg:#000000;
        --panel:#111111;
        --border:#242424;
        --text:#ffffff;
        --text-dim:#9a9a9a;
        --accent:#7DB4D4;
        --accent-soft:rgba(125,180,212,0.12);
        --serif:'Cormorant Garamond', serif;
        --sans:'Barlow', sans-serif;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        font-family:var(--sans);
        background:var(--bg);
        color:var(--text);
        min-height:100vh;
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        padding:80px 20px;
        line-height:1.6;
    }
    .logo {
        font-family:var(--serif); font-size:32px; letter-spacing:2px; font-weight:500;
        margin-bottom:10px;
    }
    .logo span { color:var(--accent); font-style:italic; }
    .subtitle {
        color:var(--text-dim); font-size:14px; letter-spacing:1.5px; text-transform:uppercase;
        margin-bottom:60px; text-align:center;
    }
    .grid {
        display:grid; grid-template-columns:repeat(3, 1fr); gap:24px;
        max-width:1000px; width:100%;
    }
    @media (max-width:800px){ .grid{ grid-template-columns:1fr; } }
    .card {
        background:var(--panel); border:1px solid var(--border);
        padding:40px 28px; text-align:center; text-decoration:none; color:var(--text);
        transition:border-color .3s ease, transform .3s ease, background .3s ease;
    }
    .card:hover {
        border-color:var(--accent); transform:translateY(-4px);
        background:var(--accent-soft);
    }
    .card-num {
        font-family:var(--serif); font-style:italic; font-size:48px; color:var(--accent);
        margin-bottom:16px;
    }
    .card-title {
        font-size:14px; letter-spacing:2px; text-transform:uppercase; font-weight:600;
        margin-bottom:8px;
    }
    .card-desc { color:var(--text-dim); font-size:13px; }
    footer { margin-top:60px; color:#555; font-size:12px; letter-spacing:1px; }
</style>
</head>
<body>
    <div class="logo">Ángel <span>Llanos</span></div>
    <div class="subtitle">Elige la versión de la web</div>
    <div class="grid">
        <a class="card" href="v1.html">
            <div class="card-num">01</div>
            <div class="card-title">Versión 1</div>
            <div class="card-desc">Diseño original</div>
        </a>
        <a class="card" href="v2.html">
            <div class="card-num">02</div>
            <div class="card-title">Versión 2</div>
            <div class="card-desc">Segunda alternativa</div>
        </a>
        <a class="card" href="v3.html">
            <div class="card-num">03</div>
            <div class="card-title">Versión 3</div>
            <div class="card-desc">Tercera alternativa</div>
        </a>
    </div>
    <footer>Página privada de revisión — no indexada</footer>
</body>
</html>
